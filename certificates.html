  <!-- Page Transition Overlay -->
  <div class="page-overlay" id="pageOverlay">
    <div class="loader"></div>
  </div>
  
  <div class="cursor"></div>
  
  <!-- Email Modal -->
  <div class="email-modal" id="emailModal">
    <div class="email-content">
      <h1>Reach Me @</h1><br><br>
      <div class="copy-email" id="copyEmail">shwatgal@gmail.com</div>
      <div class="copy-message" id="copyMessage">Copied!</div><br><br>
      <div class="email-options">
        <button id="closeModal">Done</button>
      </div>
    </div>
  </div>
  
  <script>
    const cvLink = document.getElementById('cvLink');
    
    /* =========================
    CV
    ========================= */
    cvLink.addEventListener('click', (e) => {
      e.preventDefault();

      // Show optional overlay effect
      overlay.classList.add('active');

      const cvUrl = "https://onedrive.live.com/view.aspx?resid=9A6AB66731AF6BB5!sd766172ccbc04d03a42da1ef2645d9e8&redeem=aHR0cHM6Ly8xZHJ2Lm1zL2IvYy85YTZhYjY2NzMxYWY2YmI1L0lRQXNGMmJYd01zRFRhUXRvZThtUmRub0FTbXNqcXBGbVZaZmtNRFU0eEtlYkNBP2U9YkFvd29n";

      // Open in new tab after slight delay
      setTimeout(() => {
        window.open(cvUrl, "_blank");
        overlay.classList.remove('active'); // optional remove after redirect
      }, 200);
    });
    
    const emailBtn = document.querySelector('.email');
    const emailModal = document.getElementById('emailModal');
    const closeModal = document.getElementById('closeModal');
    
    const overlay = document.getElementById('pageOverlay');
    
    const cursor = document.querySelector('.cursor');
    const links = document.querySelectorAll('a');
    
    /* =========================
    EMAIL MODAL LOGIC
    ========================= */
    
    // Open email modal
    emailBtn.addEventListener('click', (e) => {
      e.preventDefault();
      emailModal.classList.add('active');
    });
    
    // Close email modal when clicking the "Done" button
    closeModal.addEventListener('click', () => {
      emailModal.classList.remove('active');
    });
    
    // Close modal when clicking anywhere outside the content box
    emailModal.addEventListener('click', (e) => {
      if (!e.target.closest('.email-content')) {
        emailModal.classList.remove('active');
      }
    });
    
    /* =========================
    CUSTOM CURSOR LOGIC
    ========================= */
    
    document.addEventListener('mousemove', (e) => {
      cursor.style.top = e.clientY + 'px';
      cursor.style.left = e.clientX + 'px';
    });
    
    document.addEventListener('mousedown', () => cursor.classList.add('click'));
    document.addEventListener('mouseup', () => cursor.classList.remove('click'));
    
    links.forEach(link => {
      link.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      link.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });
    
    // === COPY EMAIL TO CLIPBOARD ===
    const copyEmail = document.getElementById('copyEmail');
    const copyMessage = document.getElementById('copyMessage');
    
    copyEmail.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(copyEmail.textContent.trim());
        copyMessage.style.display = 'block';
        copyEmail.style.background = '#d7f5da';
        copyEmail.style.color = '#1a5d1a';
        
        // Hide message after 1.5s
        setTimeout(() => {
          copyMessage.style.display = 'none';
          copyEmail.style.background = '#f7f7f7';
          copyEmail.style.color = '#333';
        }, 1500);
      } catch (err) {
        alert('Failed to copy email.');
      }
    });
    
  </script>

        <div class="course_name">TensorFlow Developer Professional</div>
